# Paper Digest — example configuration for forking
# Copy this to config.yaml and fill in your values.
# Secrets (NOTION_TOKEN, ANTHROPIC_API_KEY / OPENAI_API_KEY) always come from
# environment variables or GitHub Secrets — never put them here.

notion_parent_page_id: "YOUR_NOTION_PAGE_ID_HERE"

keywords:
  - "large language model"
  - "machine learning"
  - "your-research-keyword-here"

tracked_venues:
  - "ACL 2026"
  - "NeurIPS 2026"

research_profile: |
  Describe your research focus here in 2-5 sentences.
  The LLM uses this both for relevance scoring and for generating the
  "내 연구와의 연결점" section in each Korean note.
  Be specific about your methods, datasets, and open questions.

arxiv_categories:
  - cs.CL
  - cs.AI
  - cs.LG

days_back: 7
max_papers_to_rank: 1500
top_n: 10

llm:
  # Supported providers: "anthropic" | "openai"
  provider: "anthropic"
  # Cheap model for bulk ranking (low cost, many calls)
  ranking_model: "claude-haiku-4-5"
  # High-quality model for Korean note generation (fewer calls)
  notes_model: "claude-opus-5"
  # --- OpenAI alternative ---
  # provider: "openai"
  # ranking_model: "gpt-4o-mini"
  # notes_model: "gpt-4o"

# ── IT news (optional) ───────────────────────────────────────────────────────
# Off by default. When enabled, news is collected in the same weekly run and
# written to the same Notion DB with Type = "뉴스" (papers are "논문").
news:
  enabled: true

  hacker_news:
    enabled: true
    min_points: 100      # community score floor — free first-pass filter

  # Any RSS or Atom feed. Adding a publication is a config edit, not a code change.
  rss_feeds:
    - "https://techcrunch.com/feed/"
    - "https://www.theverge.com/rss/index.xml"
    - "https://feeds.arstechnica.com/arstechnica/technology-lab"

  top_n: 5               # max news pages per weekly run

  # Optional. Falls back to the paper keywords above when omitted — IT news
  # usually wants a broader net than a paper query does.
  keywords:
    - "AI"
    - "LLM"
    - "OpenAI"
    - "Anthropic"
    - "GPU"
    - "chip"
    - "open source"
