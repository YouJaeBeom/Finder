# Paper Digest — example configuration for forking
# Copy this to config.yaml and fill in your values.
# Secrets (NOTION_TOKEN, ANTHROPIC_API_KEY / OPENAI_API_KEY) always come from
# environment variables or GitHub Secrets — never put them here.

notion_parent_page_id: "YOUR_NOTION_PAGE_ID_HERE"

# Optional. Pin the database every run appends to. Fill this in with the ID that
# `python -m paper_digest init` prints. Left empty, the tool finds its database
# under the parent page (or creates it on the very first run).
notion_database_id: ""

# Entries are OR-ed. Each one can be a phrase, or a rule combining terms:
#
#   - "a phrase"                 this phrase appears
#   - all: [A, B]                both appear
#   - any: [A, B]                at least one appears
#   - all: [[A, B], [C, D]]      (A or B) and (C or D)  — nested list = "any of"
#     not: [E]                   ...and E does not appear
#
# A broad word on its own is a wide net — "LLM" alone matches most of cs.CL.
# Pair broad words with a topic using `all`.
keywords:
  - "your-specific-phrase-here"
  - all:
      - ["LLM", "large language model"]
      - ["your-topic", "another-topic"]

tracked_venues:
  - "ACL 2026"
  - "NeurIPS 2026"

research_profile: |
  Describe your research focus here in 2-5 sentences.
  The LLM uses this both for relevance scoring and for generating the
  "내 연구와의 연결점" section in each Korean note.
  Be specific about your methods, datasets, and open questions.

arxiv_categories:
  - cs.CL
  - cs.AI
  - cs.LG

days_back: 7
max_papers_to_rank: 1500
top_n: 10

# Claude (Anthropic) and ChatGPT (OpenAI) are both supported. Switch the
# provider and supply that provider's key (ANTHROPIC_API_KEY / OPENAI_API_KEY).
# Ranking and note generation take separate models either way, so the
# cheap-filter / good-writer split works on both.
llm:
  provider: "anthropic"                # "anthropic" | "openai"
  ranking_model: "claude-haiku-4-5"    # cheap model, one call per 20 papers
  notes_model: "claude-opus-5"         # high-quality model, top-N only

  # --- ChatGPT alternative ---
  # provider: "openai"
  # ranking_model: "gpt-4o-mini"
  # notes_model: "gpt-4o"

# ── IT news (optional) ───────────────────────────────────────────────────────
# Off by default. When enabled, news is collected in the same weekly run and
# written to the same Notion DB with Type = "뉴스" (papers are "논문").
#
# News skips LLM relevance scoring — the sources are already curated. Selection
# is keyword filter → score/recency order → one story per source in turn → top_n.
news:
  enabled: false

  hacker_news:
    enabled: true
    min_points: 100      # community score floor — free first-pass filter

  # Any RSS or Atom feed. Adding a publication is a config edit, not a code change.
  rss_feeds:
    - "https://techcrunch.com/feed/"
    - "https://www.theverge.com/rss/index.xml"
    - "https://feeds.arstechnica.com/arstechnica/technology-lab"

  top_n: 5               # max news pages per weekly run

  # Leave EMPTY to keep everything the sources deliver; fill in to narrow the
  # digest. A story matching any one keyword in its title or summary is kept.
  keywords:
    - "AI"
    - "LLM"
    - "OpenAI"
    - "Anthropic"
    - "GPU"
    - "chip"
    - "open source"
