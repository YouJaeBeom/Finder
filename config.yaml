# Paper Digest Configuration
# Secrets (NOTION_TOKEN, ANTHROPIC_API_KEY / OPENAI_API_KEY) come from environment variables
# — never put secrets in this file.

# ── Notion ──────────────────────────────────────────────────────────────────
# The page ID from your Notion workspace where the database will be created.
# Get it from the page URL: notion.so/<workspace>/<PAGE_ID>
notion_parent_page_id: "https://app.notion.com/p/Finder-3bc1256e056180898608c39506c43463?source=copy_link"

# Optional but recommended once you have run `python -m paper_digest init`.
# Pinning the database ID here guarantees every run — local or GitHub Actions —
# appends to the same database instead of creating a new one. Leave it empty and
# the tool looks for its database under the parent page each run.
notion_database_id: ""

# ── Research keywords ────────────────────────────────────────────────────────
# 목록의 각 항목은 OR 로 묶입니다 (하나라도 맞으면 후보). 대소문자와 하이픈은
# 무시하고 ("retrieval-augmented" = "retrieval augmented"), 제목과 초록을 함께
# 봅니다. 짧은 약어는 단어 앞에서만 맞습니다 (RAG 가 stoRAGe 에 안 걸림).
#
#   - "구절"                        이 구절이 있으면 매치
#   - all: [A, B]                   A 와 B 가 모두 있어야 매치
#   - any: [A, B]                   A 나 B 중 하나라도 있으면 매치
#   - all: [[A, B], [C, D]]         (A 나 B) 그리고 (C 나 D)   ← 중첩 = "이 중 하나"
#     not: [E]                      단, E 가 있으면 제외
#
# 넓은 단어(bias, fairness, robustness, retrieval)는 단독으로 두면 분야 전체가
# 걸립니다. 아래에서는 전부 주제어와 AND 로 묶어 두었습니다.

# 여러 규칙에서 재사용하는 "모델 용어 중 하나" 묶음 (YAML 앵커)
_model_terms: &model
  ["LLM", "large language model", "language model", "foundation model",
   "generative model", "chatbot", "conversational agent"]

keywords:
  # ── 1. 공정하고 신뢰할 수 있는 AI ─────────────────────────────────────────
  - "algorithmic bias"
  - "bias mitigation"
  - "debiasing"
  - "responsible AI"
  - "trustworthy AI"
  - "AI alignment"
  - "AI safety"
  - any: ["algorithmic audit", "algorithmic auditing", "model auditing",
          "auditing framework"]
  - all:
      - ["fairness", "fair ranking", "unfairness"]
      - [*model, ["retrieval", "ranking", "recommendation", "search",
                  "dataset", "classifier", "decision"]]
  - all:
      - ["robustness", "adversarial"]
      - *model

  # ── 2. LLM 과 정치적 편향 (핵심 주제) ─────────────────────────────────────
  - "political bias"
  - "ideological bias"
  - "partisan bias"
  - "political ideology"
  - "political leaning"
  - "political orientation"
  - "political stance"
  - "political compass"
  - all:
      - ["bias", "stance", "opinion", "value"]
      - ["steering", "steerability", "steerable", "steer"]
  - all:
      - ["prompt sensitivity", "prompt robustness", "prompt perturbation",
         "prompt variation"]
      - *model
  - all:
      - ["multilingual", "cross-lingual", "cross-cultural"]
      - ["bias", "fairness", "evaluation", "benchmark"]

  # ── 3. 정보 검색 · 탐색 · RAG ─────────────────────────────────────────────
  - "retrieval-augmented generation"
  - "information retrieval"
  - "filter bubble"
  - "echo chamber"
  - "generative search"
  - "conversational search"
  - any: ["search personalization", "personalized search",
          "personalized ranking", "search result diversification"]
  - all:
      - ["retrieval", "search", "ranking", "RAG"]
      - ["bias", "fairness", "diversity", "exposure", "polarization"]
  - all:
      - ["information access", "information exposure", "information diversity"]
      - ["algorithmic", "AI", "LLM", "search", "recommender"]

  # ── 4. 웹 데이터 · 데이터 중심 AI ─────────────────────────────────────────
  - "data-centric AI"
  - "data provenance"
  - "dataset documentation"
  - "data quality"
  - "bias transfer"
  - any: ["web corpus", "web corpora", "web crawl", "common crawl",
          "crawled corpus"]
  - all:
      # "corpora" 는 corpus 의 복수형이라 따로 넣어야 합니다
      - ["dataset", "training data", "pretraining data", "corpus", "corpora"]
      - ["bias", "fairness", "diversity", "representation", "provenance",
         "contamination"]

  # ── 5. 평가 · 계산사회과학 ────────────────────────────────────────────────
  - "LLM-as-a-judge"
  - "computational social science"
  - "political communication"
  - "human-AI interaction"
  - "public opinion"
  - all:
      - ["benchmark", "evaluation", "human evaluation", "annotation"]
      - [*model, ["bias", "fairness", "political", "social"]]

# ── Venue 표기 ────────────────────────────────────────────────────────────────
# OpenAlex 는 학회를 정식 명칭으로 줍니다 ("Proceedings of the 32nd ACM
# International Conference on Information and Knowledge Management"). Notion
# Venue 컬럼에는 짧은 약칭이 들어가도록 자동 변환합니다 → CIKM
#
# 주요 학회/저널(ACL, EMNLP, NAACL, SIGIR, CIKM, WSDM, KDD, RecSys, WWW,
# SIGMOD, VLDB, ICDE, TKDE, TOIS, NeurIPS, ICML, ICLR, AAAI, IJCAI, CVPR ...)
# 은 내장 표에 있습니다. 표에 없는 곳은 아래에 추가하세요.
# 왼쪽은 정식 명칭의 일부(부분 문자열), 오른쪽이 Venue 에 찍힐 이름입니다.
venue_aliases: {}
  # "Workshop on Machine Learning for Systems": "MLSys Workshop"
  # "Korea Software Congress": "KSC"

# ── Tracked venues (for batch mode) ──────────────────────────────────────────
# batch 모드에서 게재 확정을 찍을 때 쓰는 목록입니다.
tracked_venues:
  - "ACL 2026"       # NLP
  - "EMNLP 2026"
  - "NAACL 2026"
  - "SIGIR 2026"     # 정보 검색
  - "CIKM 2026"
  - "WSDM 2026"
  - "WWW 2026"
  - "FAccT 2026"     # 공정성 · 책임성 · 투명성
  - "AIES 2026"
  - "ICWSM 2026"     # 웹 · 소셜 미디어
  - "CSCW 2026"      # 인간-AI 상호작용
  - "ICLR 2026"
  - "NeurIPS 2026"

# ── Research profile ─────────────────────────────────────────────────────────
# 논문 관련도 채점(싼 모델)과 "내 연구와의 연결점" 작성(좋은 모델)에 모두
# 쓰입니다. 키워드가 후보를 넓게 잡아오면, 이 글이 그중 무엇이 실제로 중요한지
# 를 판단합니다. 구체적일수록 좋습니다.
research_profile: |
  제 연구는 AI 시스템의 공정성과 신뢰성, 특히 대형 언어 모델(LLM)의 정치적
  편향에 초점을 맞추고 있습니다. LLM 이 정치적·이념적 성향을 어떻게 드러내는지
  측정하는 벤치마크를 설계하고, 그 편향이 어디서 오는지 인과적으로 분석하며,
  프롬프트로 성향을 얼마나 조종할 수 있는지(steerability)와 프롬프트 변형에
  대한 강건성을 다국어 환경에서 평가합니다.

  두 번째 축은 정보 검색과 RAG 입니다. 검색 개인화가 만드는 필터 버블,
  검색·검색증강생성 과정에서 생기는 노출 편향과 정보 다양성 문제, 그리고
  생성형 검색이 사람의 정보 접근을 어떻게 바꾸는지에 관심이 있습니다.

  세 번째 축은 데이터입니다. 웹 코퍼스가 어떻게 구성되는지, 데이터의 편향이
  모델로 어떻게 전이되는지, 데이터 출처(provenance)와 품질을 어떻게 문서화하고
  평가할지를 봅니다.

  평가 방법론 자체도 연구 대상입니다. LLM-as-a-judge 의 타당성, 사람 평가와의
  정합성, 벤치마크 설계, 그리고 계산사회과학 관점에서 알고리즘이 여론과 정보
  노출에 미치는 영향을 다룹니다.

  따라서 다음은 관련도가 낮습니다: 편향·공정성·정보 접근과 무관한 순수 성능
  최적화(추론 속도, 양자화, 커널), 비전 전용 연구, 이론적 최적화 논문.

# ── arXiv categories ─────────────────────────────────────────────────────────
arxiv_categories:
  - cs.CL   # Computation and Language — LLM, 편향 측정, 평가
  - cs.IR   # Information Retrieval — 검색, 개인화, RAG
  - cs.CY   # Computers and Society — 공정성, 정책, 계산사회과학
  - cs.AI   # Artificial Intelligence
  - cs.LG   # Machine Learning

# ── Collection window ─────────────────────────────────────────────────────────
days_back: 7

# ── Cost controls ─────────────────────────────────────────────────────────────
max_papers_to_rank: 1500  # truncate by score estimate if exceeded
top_n: 10                 # maximum Notion pages per weekly run (5-10 target)

# ── LLM provider ─────────────────────────────────────────────────────────────
# Claude(Anthropic) 와 ChatGPT(OpenAI) 둘 다 됩니다. provider 를 바꾸고 해당
# 제공자의 키를 GitHub Secrets 에 넣으면 끝입니다 (Anthropic → ANTHROPIC_API_KEY,
# OpenAI → OPENAI_API_KEY). 랭킹과 노트 작성 모델은 따로 지정하므로,
# "싼 모델로 거르고 좋은 모델로 정리한다"는 구조는 어느 쪽이든 동일합니다.
llm:
  provider: "anthropic"          # "anthropic" | "openai"
  ranking_model: "claude-haiku-4-5"    # cheap bulk ranking
  notes_model: "claude-sonnet-5"       # high-quality note generation

  # ── ChatGPT 로 바꾸려면 위 세 줄을 지우고 아래를 쓰세요 ──
  # provider: "openai"
  # ranking_model: "gpt-4o-mini"       # 저렴한 대량 랭킹용
  # notes_model: "gpt-4o"              # 노트 작성용
  # (계정에서 쓸 수 있는 어떤 chat 모델 ID 든 넣을 수 있습니다)

# ── IT news (optional) ───────────────────────────────────────────────────────
# Written to the same Notion DB as papers, with Type = "뉴스" (papers are "논문").
#
# Unlike papers, news does NOT go through LLM relevance scoring. Hacker News is
# already filtered by community score and the feeds below are hand-picked, so
# the sources are curated by construction. Selection is: keyword filter →
# score/recency order → one story per source in turn → top_n. The model is used
# only to write the Korean briefing for the stories that made the cut.
news:
  enabled: true

  hacker_news:
    enabled: true
    min_points: 100      # community score floor — free first-pass filter

  # Any RSS or Atom feed. Adding a publication is a config edit, not a code change.
  rss_feeds:
    - "https://techcrunch.com/feed/"
    - "https://www.theverge.com/rss/index.xml"
    - "https://feeds.arstechnica.com/arstechnica/technology-lab"

  top_n: 5               # max news pages per weekly run

  # Leave this list EMPTY to keep everything the sources deliver.
  # 뉴스는 논문보다 넓게 잡아도 됩니다 — 출처가 이미 큐레이션돼 있으니까요.
  keywords:
    - "AI"
    - "LLM"
    - "OpenAI"
    - "Anthropic"
    - "chatbot"
    - "open source"
    # 연구 주제와 겹치는 것들
    - "bias"
    - "misinformation"
    - "disinformation"
    - "content moderation"
    - "search engine"
    - "recommendation algorithm"
    - "AI regulation"
    - "AI policy"
    - "copyright"
    - "training data"
