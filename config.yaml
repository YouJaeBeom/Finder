# Paper Digest — 연구실 공용 설정
#
# 이 파일은 **랩 전체**에 적용되는 것만 담습니다. 개인의 연구 주제와 키워드는
# members/<id>.yaml 에 있습니다. 비밀값(NOTION_TOKEN, ANTHROPIC_API_KEY /
# OPENAI_API_KEY)은 환경변수에서 옵니다 — 절대 이 파일에 넣지 마세요.

# ── Notion ──────────────────────────────────────────────────────────────────
# 워크스페이스 메인 페이지. 이 아래에 코드가 전부 만듭니다:
#
#   📄 <이 페이지>
#   ├── 📰 IT 뉴스          공용 DB (뉴스는 전원 공유)
#   ├── 📄 유재범            멤버 페이지
#   │   └── 📚 논문          그 사람 전용 DB
#   └── 📄 ...
#
# 페이지 링크를 그대로 붙여도 되고 32자 ID 만 넣어도 됩니다.
# 통합(integration)에 이 페이지를 공유해야 합니다: '···' → 'Connections'.
#
# DB ID 를 여기 적을 필요는 없습니다. state.json 이 캐시하고, 캐시가 없으면
# 제목으로 다시 찾습니다 — 그래서 state.json 유실은 조회 한 번의 비용입니다.
notion_parent_page_id: "https://app.notion.com/p/Finder-3bc1256e056180898608c39506c43463?source=copy_link"

# ── 멤버 ─────────────────────────────────────────────────────────────────────
# 한 명당 파일 하나. 파일명(확장자 제외)이 멤버 ID 입니다.
#   python -m paper_digest members list       등록된 멤버와 예상 분량
#   python -m paper_digest members validate   전 파일 검사 (문제를 한 번에 전부)
members_dir: "members"

# ── 상한 ─────────────────────────────────────────────────────────────────────
# 공용 API 키를 쓰므로 신뢰가 아니라 코드로 막습니다. 위반하면 경고가 아니라
# **실행 거부**입니다 — 한 명의 오타(top_n: 300)가 전원의 예산이기 때문입니다.
limits:
  max_members: 15
  max_top_n_per_member: 30
  # 실행 전체 가드. 병렬 처리(llm.concurrency) 이후로는 시간이 아니라 비용이
  # 기준입니다.
  #
  # 실측 2026-08 (gpt-5.6-terra, concurrency 12): 노트 편당 약 2초 · $0.0115,
  # 채점 120편당 3.9초. 15명이 각자 25편씩 받으면 375편이고 17분, $9 입니다.
  # 600 은 그 두 배까지 감당하는 값이고, 넘으면 실행이 여기서 멈춥니다.
  #
  # 예산은 멤버들에게 균등 배분되고 적게 쓴 사람의 몫은 다음 사람에게 넘어갑니다.
  # 멤버 순서가 고정이라 선착순으로 두면 매달 같은 사람이 손해를 봅니다.
  max_notes_per_run: 600

# ── 논문 소스: 학회와 저널 ────────────────────────────────────────────────────
# 논문은 Semantic Scholar 한 곳에서만 가져옵니다. API 키가 필요 없고, venue 와
# 초록과 식별자를 한 번의 요청으로 함께 줍니다.
#
# 핵심은 **화이트리스트**입니다. 여기 목록에 있는 학회·저널의 논문만 들어옵니다.
# 이게 품질 장치의 전부입니다 — 주제 필터에 의존하면 "Advanced Electromagnetics"
# 같은 약탈적 저널이 NLP 논문을 실어 결과를 뒤덮습니다. 실제로 그래서 OpenAlex
# 소스를 제거했습니다.
#
# 수집은 venue 와 날짜만으로 이뤄집니다. 키워드는 그 뒤에 로컬에서만 쓰이므로
# **멤버가 늘어도 외부 요청 수는 그대로입니다.** 이게 "수집 1회"의 근거입니다.
#
# 목록은 도구에 동봉돼 있습니다 (paper_digest/data/venues.csv).
# 학회 점수는 한국정보과학회 / BK21 / KAIST / SNU / POSTECH 종합 순위를 정규화한
# 것이며 출처는 https://gist.github.com/Pusnow/6eb933355b5cb8d31ef1abcb3c3e1206
# 저널 점수는 손으로 매겼습니다.
#
# venue 목록은 랩 소유입니다. 멤버가 개인화할 수 없습니다 — 수집이 공용 1회라
# 구조적으로 불가능합니다. 화이트리스트에 없는 곳은 누구에게도 영영 안 들어오니,
# 새 분야가 들어오면 여기(정확히는 venues.csv)를 손봐야 합니다.
conferences:
  enabled: true

  # 0 = venues.csv 전체. 점수로는 아무것도 거르지 않고, Semantic Scholar 에 논문이
  # 있는 239곳을 전부 조회합니다 (0건인 곳은 요청만 쓰므로 자동 제외).
  #
  # 점수 컷을 쓰지 않는 이유. 이 도구가 하는 일은 "상위 학회·저널 풀에서 **내 연구에**
  # 맞는 논문을 찾는" 것이지 "상위 중에서도 더 급이 높은 곳을 찾는" 것이 아닙니다.
  # venues.csv 에 있다는 것 자체가 이미 심사를 거치는 실재 venue 라는 뜻이고, 그
  # 안에서 무엇을 볼지는 급이 아니라 관련도가 정해야 합니다.
  #
  # 점수는 한국 CS 종합 순위를 정규화한 값이라 분야 편향이 큽니다. 0.5 컷은 ICWSM ·
  # EACL · COLING · RecSys · NAACL · CoNLL 을, 0.1 컷은 ECAI(유럽 대표 AI 학회) ·
  # ICPR · ICMR 을 잘라냈습니다. 전부 급이 낮아서가 아니라 순위표가 낮게 매겨서입니다.
  #
  # 관련도 채점에는 venue 가 아예 들어가지 않습니다 — 제목과 초록만 보고 그 사람의
  # research_profile 에 대해 점수를 매깁니다. 그래서 풀을 넓혀도 관련 없는 분야의
  # 논문은 5점 미만으로 떨어질 뿐입니다.
  #
  # 넓힌 만큼 채점할 논문이 늘고 그만큼 비용이 늡니다 (상한은 max_papers_to_rank).
  # 정밀도는 관련도 채점이 책임집니다 — 관련 없는 논문은 5점 미만으로 떨어집니다.
  # 1.00 = 모든 기관이 최우수로 꼽은 곳(ACL, SIGIR, KDD, WWW, CHI, AAAI, ICML,
  # NeurIPS, SIGMOD ...). 다시 좁히려면 0.5~1.0 으로.
  min_score: 0

  # 점수와 무관하게 반드시 포함/제외할 학회 (약자)
  include: []
  exclude: []

  # 프로시딩이 통째로 떨어지는 주를 감당할 만큼 넉넉해야 합니다. 수집은
  # 요청 비용뿐이고, 실제 지출은 max_papers_to_rank 가 따로 막습니다.
  max_results: 3000

journals:
  enabled: true

  # 0.1 = 28곳. 저널 점수는 손으로 매긴 것이라 컷을 내려도 거의 변하지 않습니다
  # (0.5 에서 26곳 → 0.1 에서 28곳, Digital Journalism 과 JDIQ 가 추가됩니다).
  # TPAMI, TOIS, TACL, TKDE, CL, JMLR, JAIR, AIJ, JASIST, TOCHI, CSUR, TKDD,
  # TWEB, IPM, NatMI, CACM, TIST, TORS, DMKD, NatHB, NMS, Political
  # Communication, SSCR, EPJ Data Science, POQ, IJHCS
  min_score: 0

  include: []
  exclude: []

  max_results: 1000

# ── Venue 표기 ────────────────────────────────────────────────────────────────
# Semantic Scholar 는 학회를 정식 명칭으로 줍니다 ("Annual Meeting of the
# Association for Computational Linguistics"). Notion Venue 컬럼에는 짧은 약칭이
# 들어가도록 자동 변환합니다 → ACL
#
# 주요 학회/저널은 내장 표에 있습니다. 표에 없는 곳은 아래에 추가하세요.
# 왼쪽은 정식 명칭의 일부(부분 문자열), 오른쪽이 Venue 에 찍힐 이름입니다.
venue_aliases: {}
  # "Workshop on Machine Learning for Systems": "MLSys Workshop"
  # "Korea Software Congress": "KSC"

# ── Collection window ─────────────────────────────────────────────────────────
# 게재일 기준이며, 매월 실행이 이 창 전체를 다시 훑습니다. 겹치는 부분은 이미
# 받은 논문이라 중복 제거가 걸러내고, 그 제거는 **랭킹 이전에** 돌기 때문에
# 창을 넓혀도 LLM 비용은 늘지 않습니다. 늘어나는 건 수집 요청 몇 초뿐입니다.
#
# 한 달치(31일)가 아니라 60일인 이유. 이 창은 **게재일**로 거는 필터인데, Semantic
# Scholar 의 색인은 게재보다 늦게 붙습니다. 9월 1일에 8월분만 조회하면, 7월 28일에
# 나와서 8월 10일에 색인된 논문은 8월 실행 때 없었고 9월 실행의 창 밖이라 **영영
# 들어오지 않습니다.** 딱 맞는 창은 조용히 논문을 잃는 창입니다.
#
# 두 달치를 훑고 겹침은 중복 제거에 맡깁니다. 지난달에 이미 받은 논문은 다시
# 쓰이지 않으므로, 그 달에 정말 새것이 없으면 그 달은 0건으로 끝납니다.
days_back: 60

# ── Cost controls ─────────────────────────────────────────────────────────────
# 멤버 한 명이 한 실행에서 채점할 논문 수 상한.
#
# 키워드 필터가 없어지면서 이 값이 수집과 채점 사이의 **유일한** 관문이 됐습니다.
# 넘치면 수집 순서대로 잘라내는데 그 순서는 임의라, 넘치면 조용히 손해입니다.
# 실측 2026-08 풀이 2,087편이었으므로 여유를 두고 5000 으로 잡았습니다.
#
# 비용: 20편이 한 배치이고 배치당 약 $0.0061 (haiku). 5000편이면 인당 $1.5 이고,
# 실제로는 멤버 keywords 를 통과한 만큼만 씁니다 — 실측 인당 477~622편, 약 $0.15~0.20.
max_papers_to_rank: 5000

# ── 관련도 컷오프 ─────────────────────────────────────────────────────────────
# 10점 만점에 몇 점부터 노트를 쓰고 Notion 에 넣을지. 5 는 "관련 있다고 볼 만함"
# 입니다.
#
# 이 선이 맞는지는 분야에 따라 다릅니다. 실측 2026-08: 같은 컷오프 5 에서 유재범은
# 476편 중 26편, 샘플-검색RAG 는 623편 중 120편을 받았습니다. 검색 쪽 키워드가
# 학회 트랙 하나를 통째로 덮기 때문이고, 월 120편은 더 이상 다이제스트가 아닙니다.
#
# 멤버 파일에 min_relevance 를 적으면 그 사람만 올릴 수 있습니다.
min_relevance: 5

# ── LLM provider ─────────────────────────────────────────────────────────────
# Claude(Anthropic) 와 ChatGPT(OpenAI) 둘 다 됩니다. provider 를 바꾸고 해당
# 제공자의 키를 GitHub Secrets 에 넣으면 끝입니다 (Anthropic → ANTHROPIC_API_KEY,
# OpenAI → OPENAI_API_KEY). 랭킹과 노트 작성 모델은 따로 지정하므로,
# "싼 모델로 거르고 좋은 모델로 정리한다"는 구조는 어느 쪽이든 동일합니다.
llm:
  provider: "openai"
  # 채점과 노트를 같은 모델로 씁니다. 원래는 대량 채점을 싼 모델에 맡기고 노트만
  # 좋은 모델로 쓰는 2단 구성이었는데, 채점 판단이 곧 그 사람이 받는 목록이라
  # 여기서 아낀 비용은 놓친 논문으로 돌아옵니다.
  ranking_model: "gpt-5.6-terra"
  notes_model: "gpt-5.6-terra"

  # 동시에 띄울 모델 호출 수. 실행 시간의 대부분은 노트 생성이고(편당 20~25초,
  # 논문 한 편에 한 번), 각 호출은 서로 독립이라 그대로 병렬화됩니다. 계정의
  # 레이트 리밋이 유일한 제약이라 여유 있는 플랜이면 올려도 됩니다.
  # 1 = 예전의 순차 실행.
  concurrency: 12

  # ── Anthropic 으로 되돌리려면 ──
#   provider: "anthropic"
#   ranking_model: "claude-haiku-4-5"
#   notes_model: "claude-sonnet-5"

# ── IT news (공용) ───────────────────────────────────────────────────────────
# 메인 페이지의 "📰 IT 뉴스" DB 에 실행당 1회 씁니다. 멤버별로 나누지 않습니다 —
# 출처가 이미 큐레이션돼 있어 개인화할 게 없고, 1회 처리가 10회의 1/10 비용입니다.
#
# 논문과 달리 뉴스는 LLM 관련도 채점을 거치지 않습니다. Hacker News 는 커뮤니티
# 점수로 이미 걸러져 있고 아래 피드는 손으로 골랐으니, 소스가 구조적으로
# 큐레이션돼 있습니다. 선별은: 키워드 필터 → 점수/최신순 → 출처별 라운드로빈 →
# top_n. 모델은 통과한 기사의 한국어 브리핑을 쓰는 데만 씁니다.
news:
  enabled: true

  hacker_news:
    enabled: true
    min_points: 100      # community score floor — free first-pass filter

  # 어떤 RSS·Atom 피드든 됩니다. 매체 추가는 코드 변경이 아니라 설정 변경입니다.
  rss_feeds:
    - "https://techcrunch.com/feed/"
    - "https://www.theverge.com/rss/index.xml"
    - "https://feeds.arstechnica.com/arstechnica/technology-lab"

  # 공용이 됐다고 늘릴 이유는 없습니다. 보는 사람이 10명이어도 이번 주 IT 소식이
  # 두 배가 되는 건 아니니까요 — 오히려 공용이라 기준이 더 높아야 합니다.
  top_n: 20

  # 비우면 소스가 준 것을 다 남깁니다.
  # 뉴스는 논문보다 넓게 잡아도 됩니다 — 출처가 이미 큐레이션돼 있으니까요.
  keywords:
    - "AI"
    - "LLM"
    - "OpenAI"
    - "Anthropic"
    - "chatbot"
    - "open source"
    # 연구 주제와 겹치는 것들
    - "bias"
    - "misinformation"
    - "disinformation"
    - "content moderation"
    - "search engine"
    - "recommendation algorithm"
    - "AI regulation"
    - "AI policy"
    - "copyright"
    - "training data"
