# Paper Digest Configuration
# Secrets (NOTION_TOKEN, ANTHROPIC_API_KEY / OPENAI_API_KEY) come from environment variables
# — never put secrets in this file.

# ── Notion ──────────────────────────────────────────────────────────────────
# The page ID from your Notion workspace where the database will be created.
# Get it from the page URL: notion.so/<workspace>/<PAGE_ID>
notion_parent_page_id: "https://app.notion.com/p/Finder-3bc1256e056180898608c39506c43463?source=copy_link"

# Optional but recommended once you have run `python -m paper_digest init`.
# Pinning the database ID here guarantees every run — local or GitHub Actions —
# appends to the same database instead of creating a new one. Leave it empty and
# the tool looks for its database under the parent page each run.
notion_database_id: ""

# ── Research keywords ────────────────────────────────────────────────────────
# 목록의 각 항목은 OR 로 묶입니다 (하나라도 맞으면 후보). 대소문자는 무시하고
# 제목과 초록을 함께 봅니다. 항목은 세 가지 형태로 쓸 수 있습니다:
#
#   - "구절"                        이 구절이 있으면 매치
#   - all: [A, B]                   A 와 B 가 모두 있어야 매치
#   - any: [A, B]                   A 나 B 중 하나라도 있으면 매치
#   - all: [[A, B], [C, D]]         (A 나 B) 그리고 (C 나 D)   ← 중첩 = "이 중 하나"
#     not: [E]                      단, E 가 있으면 제외
#
# "LLM" 같은 넓은 단어를 단독으로 두면 cs.CL 대부분이 걸립니다. 넓은 단어는
# 아래처럼 주제어와 AND 로 묶으세요.
keywords:
  # 구절 자체가 이미 구체적이라 단독으로 둬도 안전한 것들
  - "reinforcement learning from human feedback"
  - "direct preference optimization"
  - "instruction tuning"
  - "chain of thought"
  - "retrieval augmented generation"
  - "constitutional ai"

  # 넓은 모델 용어 × 관심 주제 — 둘 다 나올 때만 후보로 잡습니다
  - all:
      - ["LLM", "large language model", "language model"]
      - ["alignment", "RLHF", "safety", "harmless",
         "hallucination", "factuality", "instruction following",
         "reasoning", "RAG", "code generation"]
    # 리뷰/서베이 논문을 빼고 싶으면 주석을 해제하세요
    not: ["survey", "position paper"]

# ── Venue 표기 ────────────────────────────────────────────────────────────────
# OpenAlex 는 학회를 정식 명칭으로 줍니다 ("Proceedings of the 32nd ACM
# International Conference on Information and Knowledge Management"). Notion
# Venue 컬럼에는 짧은 약칭이 들어가도록 자동 변환합니다 → CIKM
#
# 주요 학회/저널(ACL, EMNLP, NAACL, SIGIR, CIKM, WSDM, KDD, RecSys, WWW,
# SIGMOD, VLDB, ICDE, TKDE, TOIS, NeurIPS, ICML, ICLR, AAAI, IJCAI, CVPR ...)
# 은 내장 표에 있습니다. 표에 없는 곳은 아래에 추가하세요.
# 왼쪽은 정식 명칭의 일부(부분 문자열), 오른쪽이 Venue 에 찍힐 이름입니다.
venue_aliases: {}
  # "Workshop on Machine Learning for Systems": "MLSys Workshop"
  # "Korea Software Congress": "KSC"

# ── Tracked venues (for batch mode) ──────────────────────────────────────────
tracked_venues:
  - "ACL 2026"
  - "EMNLP 2026"
  - "NAACL 2026"
  - "ICLR 2026"
  - "NeurIPS 2026"
  - "ICML 2026"

# ── Research profile ─────────────────────────────────────────────────────────
# Describe your research focus. The LLM uses this for relevance scoring AND
# for writing the "내 연구와의 연결점" section of each note.
research_profile: |
  내 연구는 대형 언어 모델(LLM)의 정렬(alignment)과 안전성에 초점을 맞추고 있습니다.
  특히 RLHF(인간 피드백을 통한 강화 학습), 지시 추종(instruction following),
  그리고 모델이 도움이 되면서도 해롭지 않도록 하는 방법에 관심이 있습니다.
  또한 LLM의 추론 능력 향상, 환각(hallucination) 감소,
  그리고 실제 응용에서의 신뢰성 향상에도 관심을 가지고 있습니다.
  최근에는 검색 증강 생성(RAG)과 코드 생성 분야에서 LLM 활용 방법을 연구하고 있습니다.

# ── arXiv categories ─────────────────────────────────────────────────────────
arxiv_categories:
  - cs.CL   # Computation and Language
  - cs.AI   # Artificial Intelligence
  - cs.LG   # Machine Learning

# ── Collection window ─────────────────────────────────────────────────────────
days_back: 7

# ── Cost controls ─────────────────────────────────────────────────────────────
max_papers_to_rank: 1500  # truncate by score estimate if exceeded
top_n: 10                 # maximum Notion pages per weekly run (5-10 target)

# ── LLM provider ─────────────────────────────────────────────────────────────
# Claude(Anthropic) 와 ChatGPT(OpenAI) 둘 다 됩니다. provider 를 바꾸고 해당
# 제공자의 키를 GitHub Secrets 에 넣으면 끝입니다 (Anthropic → ANTHROPIC_API_KEY,
# OpenAI → OPENAI_API_KEY). 랭킹과 노트 작성 모델은 따로 지정하므로,
# "싼 모델로 거르고 좋은 모델로 정리한다"는 구조는 어느 쪽이든 동일합니다.
llm:
  provider: "anthropic"          # "anthropic" | "openai"
  ranking_model: "claude-haiku-4-5"    # cheap bulk ranking
  notes_model: "claude-sonnet-5"       # high-quality note generation

  # ── ChatGPT 로 바꾸려면 위 세 줄을 지우고 아래를 쓰세요 ──
  # provider: "openai"
  # ranking_model: "gpt-4o-mini"       # 저렴한 대량 랭킹용
  # notes_model: "gpt-4o"              # 노트 작성용
  # (계정에서 쓸 수 있는 어떤 chat 모델 ID 든 넣을 수 있습니다)

# ── IT news (optional) ───────────────────────────────────────────────────────
# Written to the same Notion DB as papers, with Type = "뉴스" (papers are "논문").
#
# Unlike papers, news does NOT go through LLM relevance scoring. Hacker News is
# already filtered by community score and the feeds below are hand-picked, so
# the sources are curated by construction. Selection is: keyword filter →
# score/recency order → one story per source in turn → top_n. The model is used
# only to write the Korean briefing for the stories that made the cut.
news:
  enabled: true

  hacker_news:
    enabled: true
    min_points: 100      # community score floor — free first-pass filter

  # Any RSS or Atom feed. Adding a publication is a config edit, not a code change.
  rss_feeds:
    - "https://techcrunch.com/feed/"
    - "https://www.theverge.com/rss/index.xml"
    - "https://feeds.arstechnica.com/arstechnica/technology-lab"

  top_n: 5               # max news pages per weekly run

  # Leave this list EMPTY to keep everything the sources deliver.
  # Fill it in to narrow the digest to your interests — a story matching any one
  # keyword in its title or summary is kept.
  keywords:
    - "AI"
    - "LLM"
    - "OpenAI"
    - "Anthropic"
    - "GPU"
    - "chip"
    - "open source"
