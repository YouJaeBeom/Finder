# 연구축 3 — 검색과 RAG 에서의 공정하고 다양한 정보 접근
#
# 샘플 멤버입니다. 실제 인원을 붙일 때 name 과 research_profile 을 바꾸고
# 파일명도 그 사람 ID 로 바꾸세요 (파일명 변경 = 새 Notion 페이지 생성).
#
# 멤버가 쓸 것은 셋입니다:
#   name              Notion 하위 페이지 제목
#   research_profile  자연어 연구 소개. 관련도 채점과 노트 작성에 쓰입니다
#   keywords          느슨한 1차 필터. 여기 걸린 것만 채점으로 넘어갑니다

name: "샘플-검색RAG"

research_profile: |
  검색과 검색증강생성(RAG)에서 공정하고 다양한 정보 접근을 연구합니다. 검색
  개인화가 만드는 필터버블과 관점 편중을 분석하고, 관점 다양성과 정보 품질을
  함께 보장하는 검색·RAG 방법을 설계합니다.

  구체적으로는 (1) 검색·랭킹·추천 시스템의 편향과 다양성 측정,
  (2) 개인화가 정보 노출에 미치는 영향(필터버블, 에코챔버, 선택적 노출),
  (3) RAG 파이프라인에서 검색기가 생성 결과의 관점 편중으로 이어지는 경로,
  (4) 생성형 검색·대화형 검색이 이용자의 정보 탐색을 바꾸는 방식에 관심이 있습니다.

  관련도가 낮은 것: 다양성·공정성·정보 노출과 무관한 순수 검색 성능 최적화
  (인덱싱 속도, 임베딩 압축, ANN 알고리즘), 추천 정확도만 올리는 모델 구조 개선,
  비전·음성 검색 전용 연구.

# ── 느슨한 1차 필터 ───────────────────────────────────────────────────────────
# 여기 걸린 논문만 관련도 채점으로 넘어갑니다. 정밀할 필요 없습니다 — 관련 없는
# 것은 뒤에서 5점 미만으로 떨어지고, 여기서 놓친 것은 아무도 다시 보지 않습니다.
#
# 이 분야는 주제어를 편향·다양성으로 좁히면 안 됩니다. 실측에서
# "Evaluation Validity in Information Retrieval"(9점) 같은 논문이 그렇게 잘렸습니다.
# 검색·랭킹·추천 이야기면 일단 들여보내고 관련도 채점에 맡깁니다.
keywords:
  - "information retrieval"
  - "retrieval augmented generation"
  - "conversational search"
  - "generative search"
  - "query"
  - "search engine"
  - "test collection"
  - "relevance judgment"
  - "click model"
  - "information seeking"
  - "information access"
  - "filter bubble"
  - "echo chamber"
  - "selective exposure"

  - any: ["retrieval", "retriever", "ranking", "ranker", "re-ranking",
          "recommender", "recommendation", "RAG", "dense retrieval"]

  - all:
      - ["search", "browsing", "user study", "eye tracking", "SERP"]
      - ["user", "behavior", "behaviour", "interaction", "personalization",
         "personalisation", "exposure", "diversity", "evaluation", "quality"]
