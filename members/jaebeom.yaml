# 연구축 1 — LLM의 정치적 편향과 맥락적 견고성
#
# 파일명(jaebeom)이 멤버 ID입니다. Notion 에는 나타나지 않고, 캐시 파일 이름과
# `--member jaebeom` 에만 쓰입니다. Notion 하위 페이지 제목은 name 입니다.
#
# 멤버가 쓸 것은 셋입니다:
#   name              Notion 하위 페이지 제목
#   research_profile  자연어 연구 소개. 관련도 채점과 노트 작성에 쓰입니다
#   keywords          느슨한 1차 필터. 여기 걸린 것만 채점으로 넘어갑니다

name: "유재범"

research_profile: |
  LLM의 정치적 편향과 맥락적 견고성을 연구합니다. 모델이 정치적으로 어느 쪽에
  기울어 있는지를 측정하고, 그 응답이 페르소나·언어·프롬프트 맥락에 따라 얼마나
  달라지는지를 분석합니다.

  구체적으로는 (1) 정치적 성향·이념 편향의 측정 방법과 벤치마크 설계,
  (2) 아첨(sycophancy)과 프롬프트 민감도처럼 맥락이 응답을 흔드는 현상,
  (3) 페르소나 프롬프팅이 정치적 입장 표명에 미치는 영향,
  (4) 다국어·교차문화 환경에서의 편향 평가에 관심이 있습니다.

  관련도가 낮은 것: 편향·공정성과 무관한 순수 성능 최적화(추론 속도, 양자화,
  커널, 서빙), 비전 전용 연구, 순수 이론 최적화, 편향을 다루지 않는 일반적인
  프롬프트 엔지니어링 기법.

# ── 느슨한 1차 필터 ───────────────────────────────────────────────────────────
# 여기 걸린 논문만 관련도 채점으로 넘어갑니다. 정밀할 필요 없습니다 — 관련 없는
# 것은 뒤에서 5점 미만으로 떨어지고, 여기서 놓친 것은 아무도 다시 보지 않습니다.
# 그래서 애매하면 넣는 쪽이 맞습니다.
#
# 항목끼리는 OR. 실측(2026-08)으로 이 셋은 풀 1,807편 중 약 400편을 남깁니다.
keywords:
  # 이 분야 고유 표현 — 단독으로도 충분히 좁습니다
  - "political bias"
  - "ideological bias"
  - "partisan"
  - "political orientation"
  - "political stance"
  - "stereotype"
  - "sycophancy"
  - "jailbreak"
  - "persona"
  - "value alignment"
  - "moral judgment"
  - "public opinion"

  # 모델 이야기 × 편향·공정성·평가 이야기
  - all:
      - ["LLM", "large language model", "language model", "foundation model",
         "chatbot", "GPT", "instruction tuned", "aligned model"]
      - ["bias", "biased", "fairness", "unfair", "discrimination", "harm",
         "toxicity", "safety", "alignment", "robustness", "consistency",
         "sensitivity", "evaluation", "benchmark", "audit", "red team"]

  # 정치·사회 맥락 × 계산적 방법
  - all:
      - ["political", "politics", "ideology", "ideological", "election",
         "democracy", "polarization", "polarisation", "misinformation",
         "disinformation", "news"]
      - ["model", "LLM", "annotation", "dataset", "corpus", "classifier",
         "measurement", "survey", "experiment", "audit"]
