# 연구축 5 — 대규모 웹 데이터 수집과 코퍼스 구축
#
# 샘플 멤버입니다. 실제 인원을 붙일 때 name 과 research_profile 을 바꾸고
# 파일명도 그 사람 ID 로 바꾸세요 (파일명 변경 = 새 Notion 페이지 생성).
#
# 멤버가 쓸 것은 셋입니다:
#   name              Notion 하위 페이지 제목
#   research_profile  자연어 연구 소개. 관련도 채점과 노트 작성에 쓰입니다
#   keywords          느슨한 1차 필터. 여기 걸린 것만 채점으로 넘어갑니다

name: "샘플-웹데이터"

research_profile: |
  대규모 웹 데이터 수집과 연구용 코퍼스 구축을 연구합니다. 웹·소셜미디어
  데이터를 안정적으로 수집하는 병렬·분산 파이프라인을 만들고, 연구 목적에 맞는
  재현 가능한 코퍼스와 데이터셋을 구축합니다.

  구체적으로는 (1) 웹 크롤링·스크래핑 파이프라인의 설계와 규모 확장,
  (2) 대규모 데이터 처리의 분산·병렬 구조와 처리량,
  (3) 소셜미디어 데이터의 표본 추출과 수집 방법론,
  (4) 재현 가능한 데이터 수집과 코퍼스 문서화(출처, 구성, 큐레이션)에
  관심이 있습니다.

  관련도가 낮은 것: 데이터 수집·구축 과정을 다루지 않고 기존 데이터셋만 쓰는
  모델링 논문, 데이터 규모와 무관한 학습 기법, 순수 스토리지·네트워크 시스템
  최적화, 비전 전용 데이터셋 논문.

# ── 느슨한 1차 필터 ───────────────────────────────────────────────────────────
# 여기 걸린 논문만 관련도 채점으로 넘어갑니다. 정밀할 필요 없습니다 — 관련 없는
# 것은 뒤에서 5점 미만으로 떨어지고, 여기서 놓친 것은 아무도 다시 보지 않습니다.
keywords:
  - "web crawl"
  - "crawler"
  - "web scraping"
  - "corpus construction"
  - "dataset construction"
  - "data collection"
  - "data curation"
  - "data pipeline"
  - "annotation"
  - "reproducibility"
  - "sampling"
  - "social media data"
  - "digital trace"
  - "computational social science"

  - all:
      - ["dataset", "corpus", "benchmark", "collection", "archive"]
      - ["large scale", "large-scale", "million", "billion", "web", "social media",
         "multilingual", "cross country", "cross-country", "documentation",
         "provenance", "license", "quality", "representativeness"]

  - all:
      - ["web", "social media", "platform", "API", "online"]
      - ["measurement", "audit", "analysis", "study", "trace", "logging",
         "scraping", "collection"]
