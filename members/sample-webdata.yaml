# 연구축 5 — 대규모 웹 데이터 수집과 코퍼스 구축
#
# 샘플 멤버입니다. 실제 인원을 붙일 때 name 과 research_profile 을 바꾸고
# 파일명도 그 사람 ID 로 바꾸세요 (파일명 변경 = 새 Notion 페이지 생성).
#
# 멤버가 쓸 것은 셋입니다:
#   name              Notion 하위 페이지 제목
#   research_profile  자연어 연구 소개. 관련도 채점과 노트 작성에 쓰입니다
#   query             느슨한 1차 필터. 여기 걸린 것만 채점으로 넘어갑니다

name: "샘플-웹데이터"

research_profile: |
  대규모 웹 데이터 수집과 연구용 코퍼스 구축을 연구합니다. 웹·소셜미디어
  데이터를 안정적으로 수집하는 병렬·분산 파이프라인을 만들고, 연구 목적에 맞는
  재현 가능한 코퍼스와 데이터셋을 구축합니다.

  구체적으로는 (1) 웹 크롤링·스크래핑 파이프라인의 설계와 규모 확장,
  (2) 대규모 데이터 처리의 분산·병렬 구조와 처리량,
  (3) 소셜미디어 데이터의 표본 추출과 수집 방법론,
  (4) 재현 가능한 데이터 수집과 코퍼스 문서화(출처, 구성, 큐레이션)에
  관심이 있습니다.

  관련도가 낮은 것: 데이터 수집·구축 과정을 다루지 않고 기존 데이터셋만 쓰는
  모델링 논문, 데이터 규모와 무관한 학습 기법, 순수 스토리지·네트워크 시스템
  최적화, 비전 전용 데이터셋 논문.

# ── 느슨한 1차 필터 ───────────────────────────────────────────────────────────
# 논문 데이터베이스에서 쓰는 검색식과 같은 문법입니다:
#
#   web crawling            붙어 있는 단어는 구(句) — "web crawling" 과 같습니다
#   a OR b / a AND b        대문자만 연산자입니다 (소문자 and 는 그냥 단어)
#   a NOT b                 a 이면서 b 는 아닌 것
#   (a OR b) AND (c OR d)   괄호로 묶습니다. 우선순위는 NOT > AND > OR
#   reproducib*             잘라 쓰기 — reproducible, reproducibility 를 한 번에
#   # 부터 줄 끝까지          주석
#
# 전체 설명은 README.md 의 "1차 필터 쿼리" 절에, 확인은
# `python -m paper_digest members validate` 로.
#
# 정밀할 필요 없습니다 — 관련 없는 것은 뒤에서 5점 미만으로 떨어지고, 여기서
# 놓친 것은 아무도 다시 보지 않습니다.
query: |
  # 이 분야 고유 표현
  "web crawl" OR crawler OR "web scraping" OR "corpus construction"
  OR "dataset construction" OR "data collection" OR "data curation"
  OR "data pipeline" OR annotation OR reproducib* OR sampling
  OR "social media data" OR "digital trace" OR "computational social science"

  # 데이터셋 이야기 × 규모·출처 이야기
  OR ( (dataset OR corpus OR benchmark OR collection OR archive)
       AND ("large scale" OR million OR billion OR web OR "social media"
            OR multilingual OR "cross country" OR documentation OR provenance
            OR license OR quality OR representativeness) )

  # 웹·플랫폼 이야기 × 관측·수집 이야기
  OR ( (web OR "social media" OR platform OR API OR online)
       AND (measurement OR audit OR analysis OR study OR trace OR logging
            OR scraping OR collection) )
