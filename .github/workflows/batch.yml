name: Proceedings batch update

# Manual only. Conference proceedings drop on their own schedule, and a human
# knows when a venue has published — polling for it buys nothing.
on:
  workflow_dispatch:
    inputs:
      venue:
        description: 'Venue label to stamp, e.g. "ACL 2026"'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: paper-digest
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Stamp accepted venue
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m paper_digest run --mode batch --venue "${{ inputs.venue }}"

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: run-report.json
          if-no-files-found: warn

      - name: Commit dedup state
        if: success()
        run: |
          # One at a time: `git add a b` with a missing b stages nothing at all.
          for f in seen_ids.json state.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "state unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update digest state after ${{ inputs.venue }} batch [skip ci]"
          git push
