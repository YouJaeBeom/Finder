name: Weekly paper digest

# Monday 08:00 KST (Sunday 23:00 UTC). GitHub cron is UTC-only.
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write        # required to commit the updated seen_ids.json

concurrency:
  group: paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run weekly digest
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m paper_digest run --mode weekly

      # Surface the reason on the run page itself. Without this the only record
      # of *why* a run failed is inside a zip you have to download, so the
      # Annotations box says nothing more useful than "exit code 1".
      - name: Explain the failure
        if: failure()
        run: |
          python - <<'PY'
          import json, os, pathlib

          report = pathlib.Path("run-report.json")
          if report.exists():
              data = json.loads(report.read_text(encoding="utf-8"))
              reason = data.get("error") or "no error recorded — see the step log"
          else:
              reason = "the run died before it could write a report — see the step log"

          # ::error:: is one line; newlines have to be escaped to survive.
          print("::error::" + str(reason).replace("\n", "%0A"))

          if summary := os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"## Weekly digest failed\n\n```\n{reason}\n```\n")
          PY

      # Always upload the report: on a failed run it is the evidence of what
      # went wrong, so this must not be skipped when the previous step exits 1.
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: run-report.json
          if-no-files-found: warn

      # Only commit when the digest succeeded — a failed run must not persist a
      # half-written dedup state that would hide those papers from the retry.
      #
      # state.json rides along because it caches the Notion database ID. The
      # runner starts from a clean checkout every week, so without it the tool
      # has to re-discover the database under the parent page on each run.
      - name: Commit dedup state
        if: success()
        run: |
          # Staged one at a time on purpose: `git add a b` with a missing b is a
          # fatal pathspec error that stages NOTHING, which would silently drop
          # seen_ids.json on every run before the database is first created.
          for f in seen_ids.json state.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "state unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update digest state after weekly run [skip ci]"

          # Anything pushed while the run was working leaves this checkout
          # behind, and the push is rejected as non-fast-forward. Rebase onto
          # it and retry rather than dropping the state — a run whose state
          # never lands has to re-rank the same papers next week.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected — rebasing onto origin/main (attempt $attempt)"
            git pull --rebase origin main
          done
          echo "::error::could not push the dedup state after 3 attempts"
          exit 1
