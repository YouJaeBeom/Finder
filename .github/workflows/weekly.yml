name: Weekly paper digest

# Monday 08:00 KST (Sunday 23:00 UTC). GitHub cron is UTC-only.
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write        # required to commit the updated seen_ids.json

concurrency:
  group: paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run weekly digest
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m paper_digest run --mode weekly

      # Always upload the report: on a failed run it is the evidence of what
      # went wrong, so this must not be skipped when the previous step exits 1.
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: run-report.json
          if-no-files-found: warn

      # Only commit when the digest succeeded — a failed run must not persist a
      # half-written dedup state that would hide those papers from the retry.
      - name: Commit dedup state
        if: success()
        run: |
          if git diff --quiet -- seen_ids.json; then
            echo "seen_ids.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json
          git commit -m "chore: update seen_ids after weekly digest [skip ci]"
          git push
