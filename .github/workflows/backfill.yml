name: Backfill

# Manual only, and meant to be run once. The weekly digest asks "what appeared
# since last week", which leaves everything published before it was set up
# unread. This ranks a long window in a single pass and keeps the best of it.
#
# Every paper it ranks is cached, not just the ones written — so running it twice
# does nothing the second time, and the weekly run afterwards only considers
# genuinely new arrivals.
#
# Leave "member" blank to backfill everyone. Set it when one person joins an
# established lab: backfilling everyone again would bill the whole lab's catch-up
# a second time.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How far back to look, in days"
        required: true
        default: "365"
        type: string
      member:
        description: "Backfill only this member ID (blank = everyone)"
        required: false
        default: ""
        type: string
      limit:
        description: "How many top-ranked papers to keep, per member"
        required: true
        default: "200"
        type: string
      sources:
        description: "Which sources to catch up on"
        required: true
        default: conferences
        type: choice
        options: [conferences, journals, both]

permissions:
  contents: write

# Shares the weekly digest's group: both write the scoring caches under state/,
# and two runs doing that at once would lose one of them.
concurrency:
  group: paper-digest
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Ranking a year is a few hundred sequential model calls and the notes are
    # a few hundred more, so this runs far longer than a weekly digest.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Validate members
        run: python -m paper_digest members list

      - name: Run backfill
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MEMBER: ${{ inputs.member }}
        run: |
          args=(--days "${{ inputs.days }}"
                --limit "${{ inputs.limit }}"
                --sources "${{ inputs.sources }}")
          if [ -n "$MEMBER" ]; then args+=(--member "$MEMBER"); fi
          python -m paper_digest run --mode backfill "${args[@]}"

      - name: Explain the failure
        if: failure()
        run: |
          python - <<'PY'
          import json, os, pathlib

          report = pathlib.Path("run-report.json")
          if report.exists():
              data = json.loads(report.read_text(encoding="utf-8"))
              reason = data.get("error") or "no error recorded — see the step log"
          else:
              reason = "the run died before it could write a report — see the step log"

          print("::error::" + str(reason).replace("\n", "%0A"))

          if summary := os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"## Backfill failed\n\n```\n{reason}\n```\n")
          PY

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: run-report.json
          if-no-files-found: warn

      # The scoring caches are the whole point of the run: they record every
      # paper considered, so the weekly digest never re-ranks them. Losing them
      # would mean paying for the ranking again.
      - name: Commit scoring caches
        if: always()
        run: |
          for f in state.json state; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "state unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update digest state after backfill [skip ci]"

          # A run this long races anything pushed while it works. The first
          # backfill took 84 minutes, a config commit landed partway through,
          # and the push was rejected as non-fast-forward — losing the entire
          # point of the run, since the ranking it recorded had already been
          # paid for. Rebase onto whatever arrived and try again.
          #
          # Two digest runs cannot overlap (the concurrency group sees to
          # that), so the only thing to rebase over is an unrelated commit,
          # which rebases cleanly. A genuine conflict fails loudly on purpose.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected — rebasing onto origin/main (attempt $attempt)"
            git pull --rebase origin main
          done
          echo "::error::could not push the scoring caches after 3 attempts"
          exit 1
