name: Monthly paper digest

# The 1st of each month at 00:00 UTC — 09:00 KST, still the 1st in Korea.
# 23:00 UTC would be 08:00 KST on the *2nd*, and cron cannot say "the last day
# of the previous month", so the run starts an hour later instead of a day late.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      member:
        description: "Serve only this member ID (blank = everyone). Use it to retry one person after a failure."
        required: false
        default: ""
        type: string

permissions:
  contents: write        # required to commit the scoring caches under state/

concurrency:
  group: paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Members are served sequentially in one job — Notion's rate limit is per
    # integration token, so parallel jobs would share one budget while each
    # behaved as though it owned the whole thing.
    #
    # Measured 2026-08 with no per-member cap: 46 notes in 20 minutes, about 26
    # seconds a note. At limits.max_members (15) that projects to ~100 minutes,
    # so 90 would have killed a full lab mid-run. 180 leaves real headroom.
    #
    # A timeout is survivable by design: the truth layer is each member's Notion
    # database, so a killed run loses only the scoring cache it never committed,
    # and the next run re-ranks rather than duplicating.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Catches a broken member file before anything is collected or spent.
      - name: Validate members
        run: python -m paper_digest members list

      - name: Run monthly digest
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MEMBER: ${{ inputs.member }}
        run: |
          if [ -n "$MEMBER" ]; then
            python -m paper_digest run --mode monthly --member "$MEMBER"
          else
            python -m paper_digest run --mode monthly
          fi

      # Surface what happened on the run page itself. Without this the only
      # record is inside a zip you have to download, so the Annotations box says
      # nothing more useful than "exit code 1" — and with ten members, "84 pages
      # created" hides the fact that one person got none.
      - name: Summarise the run
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib

          report = pathlib.Path("run-report.json")
          if not report.exists():
              print("::error::the run died before it could write a report — see the step log")
              raise SystemExit(0)

          data = json.loads(report.read_text(encoding="utf-8"))
          lines = ["## Monthly digest", "",
                   f"- pages created: **{data.get('pages_created', 0)}**",
                   f"- candidates: {data.get('candidates_found', 0)}", ""]

          if members := data.get("members"):
              lines += ["| member | candidates | new | written | error |",
                        "|---|---:|---:|---:|---|"]
              for row in members:
                  lines.append(
                      f"| {row['name']} | {row['candidates']} | {row['new']} | "
                      f"{row['created']} | {row['error'] or ''} |"
                  )
              lines.append("")

          if overlap := data.get("overlap"):
              lines += ["### 두 명 이상이 받은 논문", ""]
              for entry in overlap:
                  lines.append(f"- **{entry['title']}** ({entry['venue']}) — "
                               f"{', '.join(entry['members'])}")
              lines.append("")

          if reason := data.get("error"):
              lines += ["### 실패", "", "```", str(reason), "```"]
              print("::error::" + str(reason).replace("\n", "%0A"))

          if summary := os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: run-report.json
          if-no-files-found: warn

      # Committed even on a failed run, which is a change from when this file was
      # the source of truth for "already delivered". It no longer is — Notion is
      # (see paper_digest/notion_query.py) — so the worst a stale or missing
      # cache can cost is re-ranking on the cheap model, never a duplicate page.
      # Meanwhile skipping the commit on failure had a real cost: one member
      # failing threw away every other member's cache.
      #
      # Nothing is written to a cache before the work it records succeeded, so
      # there is no half-finished state to persist here.
      - name: Commit scoring caches
        if: always()
        run: |
          # Staged one at a time on purpose: `git add a b` with a missing b is a
          # fatal pathspec error that stages NOTHING.
          for f in state.json state; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "state unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update digest state after monthly run [skip ci]"

          # Anything pushed while the run was working leaves this checkout
          # behind, and the push is rejected as non-fast-forward. Rebase onto it
          # and retry rather than dropping the caches.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected — rebasing onto origin/main (attempt $attempt)"
            git pull --rebase origin main
          done
          echo "::error::could not push the scoring caches after 3 attempts"
          exit 1
